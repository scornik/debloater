name: CI

# BUILD-SPEC §14, §17 Phase 18.
#
# The "every push" column of the testing matrix: unit, integration, registry
# schema validation, and static analysis. Phases 16 and 17 each shipped a
# workflow for their own layer and each recorded the same warning — that §14
# asks for these to run on every push and nothing did. This is that.
#
# Deliberately not here: the stack matrix and the end-to-end suite. §14 puts
# both on "nightly + PR label", and e2e.yml runs them there. A twelve-minute
# browser suite on every push is a suite people learn to ignore.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No WordPress, three PHP versions. This is the cheap, wide job: it holds the
  # contracts, the registry loader, the resolver, the engine invariants and the
  # repository-level rules, and it is the one that tells you within a minute
  # whether a change is worth running anything else against.
  unit:
    name: Unit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Unit suite
        run: vendor/bin/phpunit --no-coverage

  # PHPCS, PHPStan and ESLint. One PHP version, because a coding standard that
  # disagrees between 8.1 and 8.3 is a bug in the standard.
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, json
          coverage: none

      - run: composer install --no-interaction --no-progress
      - run: npm ci

      - name: PHPCS
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: ESLint
        run: npm run lint:js

      - name: JavaScript unit tests
        run: npm run test:js

  # Every JSON document in registry/ validates, and the manifest describes what
  # is actually on disk. registry.yml runs this too, on registry changes only;
  # here it runs on everything, because a schema change in schemas/ can
  # invalidate a registry document that nobody touched.
  registry:
    name: Registry documents
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, json
          coverage: none

      - run: composer install --no-interaction --no-progress

      - name: Every registry document is valid JSON
        run: |
          find registry schemas -name '*.json' -print0 \
            | xargs -0 -n1 -I{} php -r 'json_decode(file_get_contents($argv[1]), true) !== null || exit(fprintf(STDERR, "%s is not valid JSON\n", $argv[1]) && 1);' {}

      - name: The manifest describes the registry on disk
        run: php tools/registry-manifest.php --check

  # A real WordPress, the plugin's own tables, real files written into
  # wp-content. Slower than the rest put together, which is why it is one job
  # on one version rather than a matrix — the versions are covered nightly.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, json
          coverage: none

      - run: npm ci

      # The WordPress test suite needs Yoast's PHPUnit Polyfills, a Composer
      # dev dependency. The plugin directory is mapped into the container as-is,
      # so a missing vendor/ here is a missing vendor/ there.
      - run: composer install --no-interaction --no-progress

      # PHPUnit 9 for the WordPress test suite is a phar, downloaded rather than
      # committed.
      - run: npm run test:integration:setup

      - run: npx wp-env start --update

      # wp-env activates the plugins listed in .wp-env.json. Debloater is
      # mapped in rather than listed, so on a fresh runner it is installed and
      # inactive — and `wp debloater` is then not a registered command.
      - run: npx wp-env run cli wp plugin activate debloater

      - run: npm run test:integration

      - name: WP-CLI end to end
        run: npm run test:cli

      - run: npx wp-env stop
        if: always()

  # The zip has to build, and it has to build **the same** on Linux and on
  # Windows. That matrix is not thoroughness for its own sake: the packaging bug
  # this job exists to catch only appeared on Windows, produced an archive only
  # Windows could read, and shipped because nothing ever built one anywhere
  # else.
  #
  # The `zips are byte-identical across platforms` step is the assertion that
  # matters most. Two platforms agreeing on a file listing is a much stronger
  # claim than each of them independently passing its own checks.
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, json, zip
          coverage: none

      - run: npm ci
      - run: npm run build

      - name: Production autoloader
        run: composer install --no-interaction --no-progress --no-dev --classmap-authoritative

      # Builds both zips and asserts the entry names, the top-level folder, the
      # directory entries, the header and what does not ship. The WordPress
      # install step inside it skips when wp-env is absent, which it is here —
      # the `integration` job is where a real WordPress runs.
      - run: npm run test:packaging

      # The archives are named for the version, so the version is read rather
      # than written here. It used to be spelled out — `debloater-0.1.0.zip` —
      # and the release after that bump made every step below open a file that
      # did not exist. `ZipArchive::open()` returns false rather than throwing,
      # nothing checked it, and the job failed one step later on a `cd` into a
      # directory nothing had extracted. Both runners had been red for five
      # commits with an error message about the wrong thing.
      - name: Resolve the built archives
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          free="dist/debloater-${version}.zip"

          for archive in "$free"; do
            if [ ! -f "$archive" ]; then
              echo "The build did not produce $archive. dist/ holds:"
              ls -la dist
              exit 1
            fi
          done

          echo "FREE_ZIP=$free" >> "$GITHUB_ENV"
          echo "Free: $free"

      - name: The zip autoloads the plugin and nothing else
        shell: bash
        run: |
          php -r '
            $zip = new ZipArchive();
            if ( true !== $zip->open( getenv( "FREE_ZIP" ) ) ) {
              fwrite( STDERR, "could not open " . getenv( "FREE_ZIP" ) . PHP_EOL );
              exit( 1 );
            }
            $zip->extractTo( "dist/extracted" );
            $zip->close();
          '
          cd dist/extracted/debloater
          php -r 'require "vendor/autoload.php"; class_exists("Debloater\\Plugin") || exit(1); class_exists("Debloater\\Tests\\Unit\\ReleaseReadinessTest") && exit(1);'
          echo "the zip autoloads the plugin and no test classes"

      # Extracted with PHP's ZipArchive rather than the platform's own unzip,
      # because this has to answer the same question on both runners: does the
      # archive produce a directory, or one flat file with a backslash in its
      # name?
      - name: The archive extracts to a directory on this platform
        shell: bash
        run: |
          test -f dist/extracted/debloater/debloater.php             || { echo "debloater.php is not a file inside the extracted directory"; exit 1; }
          test -d dist/extracted/debloater/src             || { echo "src/ did not extract as a directory"; exit 1; }
          if find dist/extracted -name '*\*' | grep -q .; then
            echo "something extracted with a backslash in its name"
            exit 1
          fi

      - name: Record the entry names for comparison
        shell: bash
        run: |
          php -r '
            foreach ( [ "free" => getenv( "FREE_ZIP" ) ] as $which => $path ) {
              $zip = new ZipArchive();

              if ( true !== $zip->open( $path ) ) {
                fwrite( STDERR, "could not open $path" . PHP_EOL );
                exit( 1 );
              }

              $names = [];

              for ( $i = 0; $i < $zip->numFiles; $i++ ) {
                $names[] = $zip->statIndex( $i )["name"];
              }

              $zip->close();
              sort( $names );
              // Written with a literal newline, never PHP_EOL: this file is
              // compared byte for byte against the one the other runner
              // produced, and PHP_EOL is CRLF on Windows. Every line would
              // differ, for a reason that has nothing to do with the archive.
              file_put_contents( "dist/entries-$which.txt", implode( "\n", $names ) . "\n" );
            }
          '
          echo "--- free, first ten ---"
          head -10 dist/entries-free.txt

      - uses: actions/upload-artifact@v4
        with:
          name: debloater-zip-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/entries-*.txt
          retention-days: 14

  # Two platforms producing the same file listing is the property that was
  # missing, and it cannot be checked inside a single matrix leg.
  package-parity:
    name: Package parity
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: debloater-zip-*
          path: artifacts

      - name: The two platforms agree on every entry name
        run: |
          for which in free; do
            ubuntu="artifacts/debloater-zip-ubuntu-latest/entries-$which.txt"
            windows="artifacts/debloater-zip-windows-latest/entries-$which.txt"

            if ! diff -u "$ubuntu" "$windows"; then
              echo
              echo "The Linux and Windows builds disagree on the $which archive."
              echo "That is how a zip with backslash separators shipped once already."
              exit 1
            fi

            echo "Both platforms produced identical entry names for $which."
          done
